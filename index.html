<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>QuickBite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🍔 QuickBite</h1>
    <a href="cart.html">🛒 Cart</a>
</header>

<div class="menu">

    <div class="item">
        <img src="burger.jpg">
        <h3>Burger</h3>
        <p>₱50</p>
        <p>Qty: <span id="Burger">0</span></p>
        <button onclick="addToCart('Burger',50,'Burger')">Add</button>
    </div>

    <div class="item">
        <img src="fries.jpg">
        <h3>Fries</h3>
        <p>₱30</p>
        <p>Qty: <span id="Fries">0</span></p>
        <button onclick="addToCart('Fries',30,'Fries')">Add</button>
    </div>

    <div class="item">
        <img src="pizza.jpg">
        <h3>Pizza</h3>
        <p>₱120</p>
        <p>Qty: <span id="Pizza">0</span></p>
        <button onclick="addToCart('Pizza',120,'Pizza')">Add</button>
    </div>

    <div class="item">
        <img src="milk tea.jpg">
        <h3>Milk Tea</h3>
        <p>₱70</p>
        <p>Qty: <span id="Milk Tea">0</span></p>
        <button onclick="addToCart('Milk Tea',70,'Milk Tea')">Add</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
